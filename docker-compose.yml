services:
  db:
    image: postgres:17-alpine
    container_name: speech_to_text_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-speech_to_text}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-speech_to_text}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: speech_to_text_backend
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-5000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      UPLOAD_FOLDER: ${UPLOAD_FOLDER:-/app/uploads}
      NLTK_DATA: ${NLTK_DATA:-/usr/local/share/nltk_data}
      WHISPER_DEVICE_PREFERENCE: ${WHISPER_DEVICE_PREFERENCE:-auto}
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-medium}
      WHISPER_CUDA_COMPUTE_TYPE: ${WHISPER_CUDA_COMPUTE_TYPE:-float16}
      OPENVINO_WHISPER_DIR: ${OPENVINO_WHISPER_DIR:-}
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./models/openvino-whisper:/app/models/openvino-whisper
      - whisper_cache:/root/.cache
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./my-app
      dockerfile: Dockerfile
    container_name: speech_to_text_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  whisper_cache: